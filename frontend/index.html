<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ✅ PRIMARY SEO TAGS -->
    <title>PricePulse - Feel the Market Pulse | Price Comparison & Demand Alerts</title>
    <meta name="description"
        content="PricePulse helps sellers know what to sell and buyers find the best prices. Real-time demand alerts, price comparison across global sellers, and smart exchange matching." />
    <meta name="keywords"
        content="price comparison, demand alerts, sell online, find cheapest price, smart marketplace, barter exchange" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://pricepulse.com" />

    <!-- ✅ Open Graph (Facebook, LinkedIn) -->
    <meta property="og:title" content="PricePulse - Feel the Market Pulse" />
    <meta property="og:description"
        content="Real-time price comparison and demand alerts for smart sellers and buyers." />
    <meta property="og:image" content="https://pricepulse.com/og-image.jpg" />
    <meta property="og:url" content="https://pricepulse.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PricePulse" />

    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PricePulse - Feel the Market Pulse" />
    <meta name="twitter:description" content="Real-time price comparison and demand alerts" />
    <meta name="twitter:image" content="https://pricepulse.com/twitter-image.jpg" />
    <meta name="twitter:site" content="@pricepulse" />

    <!-- ✅ Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- ✅ Preconnect to CDN & APIs -->
    <link rel="preconnect" href="https://api.pricepulse.com" />
    <link rel="dns-prefetch" href="https://cdn.pricepulse.com" />

    <!-- ✅ Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Open+Sans:wght@400;600;700&display=swap"
        rel="stylesheet" />

    <!-- ✅ Schema.org Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PricePulse",
        "url": "https://pricepulse.com",
        "description": "Real-time price comparison and demand alerts for smart sellers and buyers.",
        "potentialAction": {
            "@type": "SearchAction",
            "target": "https://pricepulse.com/search?q={search_term_string}",
            "query-input": "required name=search_term_string"
        }
    }
    </script>

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "PricePulse",
        "url": "https://pricepulse.com",
        "logo": "https://pricepulse.com/logo.png",
        "sameAs": [
            "https://twitter.com/pricepulse",
            "https://facebook.com/pricepulse",
            "https://instagram.com/pricepulse"
        ]
    }
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
